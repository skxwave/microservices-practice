services:
  # backend:
  #   build: .
  
  db:
    image: postgres:18-alpine
    container_name: products_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: products
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d products"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
