services:
  backend:
    build: .
    container_name: products_backend
    restart: unless-stopped
    environment:
      DB_URL: postgresql+psycopg://root:root@products_db:5432/products
      USER_SERVICE_URL: http://users_backend:8000
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - app_network

  db:
    image: postgres:18-alpine
    container_name: products_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: products
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d products"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    name: microservices_network
    external: true

volumes:
  postgres_data:
