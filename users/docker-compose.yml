services:
  # backend:
  #   build: .
  
  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d users"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
