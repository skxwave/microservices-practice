services:
  backend:
    build: .
    container_name: users_backend
    restart: unless-stopped
    environment:
      DB_URL: postgresql+psycopg://root:root@users_db:5432/users
      KAFKA_URL: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - app_network

  db:
    image: postgres:18-alpine
    container_name: users_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d users"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    name: microservices_network
    external: true

volumes:
  postgres_data:
