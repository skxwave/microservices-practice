# Dev-only additions; used together with docker-compose.yml (see justfile).
services:
  kafka:
    ports:
      - "9094:9094"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  users-db:
    ports:
      - "5432:5432"

  users-redis:
    ports:
      - "6379:6379"

  products-db:
    ports:
      - "5433:5432"

  users:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../users/main.py:/app/main.py
      - ../users/src:/app/src

  products:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
    ports:
      - "8001:8000"
    volumes:
      - ../products/main.py:/app/main.py
      - ../products/src:/app/src
