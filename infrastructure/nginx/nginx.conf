upstream users {
    server users:8000;
}

upstream products {
    server products:8000;
}

server {
    listen 80;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # proxy_pass with a URI swaps the matched prefix: /api/users/1 -> /users/1
    location /api/users {
        proxy_pass http://users/users;
    }

    location /api/products {
        proxy_pass http://products/products;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
